name: Build AWS Infrastructure

on:
  workflow_dispatch:
    

permissions: 
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPO: it-tools-repo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build infrastructure and security scan
    runs-on: ubuntu-latest
  
    defaults:
      run:
        working-directory: infra
    
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: terraform security scan
        uses: triat/terraform-security-scan@v3

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_OPS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform_build
      
      - name: pull latest production image tag from ecr repo
        id: latest_image
        run: |
          echo "image_tag=$(aws ecr describe-images --repository-name ${{ env.ECR_REPO }} | 
          jq -r '[.imageDetails[] | select(.imageTags[]|startswith("prod-"))]|
          sort_by(.imagePushedAt)|last|.imageTags[]|
          select(startswith("prod-"))')" >> "$GITHUB_OUTPUT"

      - name: print latest image tag
        run: echo "${{ steps.latest_image.outputs.image_tag }}" 
     
      - name: install terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"
      
      - name: create tfvars file
        run: |
          cat <<'EOF' > terraform.tfvars
          ${{ secrets.TF_VARS }}
          EOF

      - name: initialise terraform working directory
        working-directory: infra
        run: terraform init

      - name: check for syntax errors
        run: terraform validate
      
      - name: run terraform apply
        run: |
          terraform apply --auto-approve -input=false \
          -var="latest_tag=${{ steps.latest_image.outputs.image_tag }}" 

      


        
    
